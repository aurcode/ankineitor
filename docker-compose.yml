version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./media:/app/media
      - ./output:/app/output
      - ./logs:/app/logs
      - ./my_audio_files:/app/my_audio_files
    environment:
      - PYTHONUNBUFFERED=1
