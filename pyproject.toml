[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ankineitor"
version = "0.1.0"
description = "A data processing pipeline and Streamlit UI for Anki cards."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "celery",
    "channels",
    "channels-redis",
    "deep-translator",
    "Django>=4.2,<5.0",
    "django-cors-headers",
    "djangorestframework",
    "daphne",
    "genanki",
    "google-auth",
    "google-genai",
    "gTTS",
    "jieba",
    "loguru",
    "pandas",
    "pdf2image",
    "pinyin",
    "pydantic",
    "pydantic-settings",
    "pydub",
    "pypdf",
    "PyYAML",
    "python-dotenv",
    "pytesseract",
    "redis",
    "sqlalchemy",
    "streamlit",
    "tabulate",
    "tenacity",
    "tqdm",
    "unstructured",
]

[tool.setuptools.packages.find]
where = ["src"]
