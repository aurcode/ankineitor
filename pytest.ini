[pytest]
# Pytest configuration for Ankineitor tests
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
DJANGO_SETTINGS_MODULE = ankineitor_web.settings
pythonpath = src web/backend
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
markers =
    security: Security-related tests
    unit: Unit tests
    integration: Integration tests
    slow: Slow-running tests
    benchmark: Performance/benchmark tests, typically environment-sensitive
    config: Configuration tests
    validators: Input validation tests
    llm: LLM transformation tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning
